# GIPRE Transparency — Azure Static Web Apps deploy.
# Builds and deploys the Next.js platform/ on push to main.
# Per-PR staging environments at <base>-<pr-number>.<region>.azurestaticapps.net.
#
# Required secret: AZURE_STATIC_WEB_APPS_API_TOKEN
# (Auto-populated when SWA is created via `azd up`; otherwise set via
#  `gh secret set AZURE_STATIC_WEB_APPS_API_TOKEN -R milad9595naeimi/GIPRE-Transparency`.)

name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
    paths:
      - "platform/**"
      - ".github/workflows/azure-static-web-apps.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: platform/package-lock.json

      - name: Install Node dependencies
        run: |
          cd platform
          npm install

      - name: Build (Next.js static export)
        run: |
          cd platform
          npm run build

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          # With skip_app_build:true the action treats app_location as the pre-built
          # artifact root, so point it at platform/out (where `next build` exported).
          app_location: "/platform/out"
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close PR staging environment
    steps:
      - name: Close PR
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
